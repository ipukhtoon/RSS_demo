<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb"><title>Store Manager Demo</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--surface2:#edf3f8;--ink:#172b3a;--muted:#687b89;--line:#dce5ed;--primary:#176b87;--primary2:#0e526c;--teal:#0e8b83;--good:#16845d;--warn:#b7791f;--bad:#c04444;--shadow:0 8px 28px #18364b12;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,var(--primary),var(--teal));color:white;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}.topright{display:flex;align-items:center;gap:10px}.badge{background:#fff2d9;color:#885b0c;padding:6px 10px;border-radius:30px;font-size:11px;font-weight:800;letter-spacing:.06em}.role{background:var(--surface2);border-radius:30px;padding:7px 12px;font-size:12px;font-weight:700}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);max-width:1600px;margin:auto}.side{padding:22px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 68px)}.navlabel{font-size:10px;color:#8a9aa6;font-weight:800;letter-spacing:.12em;padding:15px 12px 8px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:12px;color:#536877;display:flex;gap:12px;align-items:center;margin:3px 0;font-weight:650}.nav .ico{width:20px;text-align:center;font-size:17px}.nav.active{background:#e3f1f5;color:var(--primary2)}.sidefoot{margin:28px 8px;padding:14px;background:#eaf4f5;border-radius:14px;color:#476875;font-size:12px}.main{padding:28px;min-width:0}.pagehead{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.pagehead h1{font-size:25px;margin:0 0 4px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:10px 15px;background:var(--primary);color:#fff;font-weight:700;box-shadow:0 3px 8px #176b8725}.btn:hover{background:var(--primary2)}.btn.secondary{background:var(--surface2);color:var(--ink);box-shadow:none}.btn.ghost{background:transparent;color:var(--primary);box-shadow:none}.btn.danger{background:#fff0f0;color:var(--bad);box-shadow:none}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}.statlabel{color:var(--muted);font-size:12px;font-weight:650}.statvalue{font-size:26px;font-weight:850;margin:7px 0 2px;letter-spacing:-.04em}.statnote{font-size:11px;color:var(--muted)}.two{grid-template-columns:1.35fr 1fr}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.cardhead h3{margin:0;font-size:15px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{background:var(--surface2);border:1px solid var(--line);padding:16px 10px;border-radius:14px;text-align:left;color:var(--ink);font-weight:700}.quick span{display:block;font-size:22px;margin-bottom:9px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#81919d;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #edf1f5;font-size:13px}tr:last-child td{border:0}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#e9f6ef;color:#16734f;font-size:11px;font-weight:750}.pill.low{background:#fff3df;color:#996416}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;min-width:0}.field label{font-size:12px;color:#607482;font-weight:700}.field input,.field select,.field textarea,.search{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;color:var(--ink);outline:none;min-width:0;width:100%}.field input:focus,.field select:focus,.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px #176b8718}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#10263780;z-index:20;display:none;place-items:center;padding:18px}.modal.show{display:grid}.dialog{background:#fff;border-radius:20px;padding:22px;width:min(100%,540px);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #061b2c40}.dialog h2{margin:0 0 18px;font-size:20px}.dialogfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.empty{text-align:center;color:var(--muted);padding:30px}.muted{color:var(--muted)}.notice{background:#edf7fa;border:1px solid #d6eaf0;padding:13px 15px;border-radius:13px;color:#426675;font-size:12px;margin-bottom:16px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#d9eef1,transparent 40%),var(--bg)}.loginbox{width:min(100%,420px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.loginbox h1{margin:16px 0 4px}.pinrow{display:flex;gap:8px}.pinrow input{text-align:center;font-size:24px;letter-spacing:.4em}.hidden{display:none!important}.mobilebar{display:none}.progress{height:8px;background:#edf1f5;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal);border-radius:20px}.amount{font-weight:800}.printhead{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:fixed;bottom:0;left:0;right:0;z-index:10;min-height:0;height:66px;background:#fff;border:0;border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 8px;gap:4px}.navlabel,.sidefoot{display:none}.nav{min-width:66px;width:auto;flex-direction:column;gap:1px;padding:5px;font-size:10px;text-align:center}.nav .ico{font-size:18px}.main{padding:22px 16px 88px}.top{padding:0 15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.top{height:60px}.brand small{display:none}.badge{font-size:9px;padding:5px 7px}.role{font-size:10px}.pagehead h1{font-size:22px}.pagehead{align-items:flex-start}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.statvalue{font-size:23px}.card{padding:15px}}
@media print{body{background:#fff}.top,.side,.pagehead,.noprint,.modal{display:none!important}.layout{display:block}.main{padding:0}.printhead{display:block;text-align:center;margin-bottom:15px}.card{box-shadow:none;border:0;padding:0}.tablewrap{overflow:visible}table{white-space:normal}th,td{padding:7px;border-bottom:1px solid #ddd}}
</style></head>
<body><div id="root"></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
(()=>{'use strict';
const LIMITS={products:10,categories:5,customers:5,suppliers:3,sales:20,purchases:5,expenses:10,returns:3,credits:5};
const KEY='store_manager_demo_v1';
const seed=()=>({store:'Your Store',theme:'light',role:'Owner',products:[{id:1,name:'Premium Rice',sku:'SKU-001',category:'Grocery',price:280,cost:220,stock:25},{id:2,name:'Cooking Oil 1L',sku:'SKU-002',category:'Grocery',price:540,cost:470,stock:14},{id:3,name:'Bath Soap',sku:'SKU-003',category:'Personal Care',price:160,cost:115,stock:8}],categories:['Grocery','Personal Care'],customers:[{id:1,name:'Ali Khan',phone:'03001234567',balance:0},{id:2,name:'Sara Ahmed',phone:'03007654321',balance:350}],suppliers:[{id:1,name:'City Wholesale',phone:'03001112222'}],sales:[],purchases:[],expenses:[],returns:[],credits:[],next:4});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),money=n=>'Rs '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='Dashboard';
const navs=[['Dashboard','⌂'],['New Sale','＋'],['Products','▦'],['Sales','▤'],['Customers','♙'],['Suppliers','♧'],['Purchases','⇧'],['Expenses','↗'],['Returns','↩'],['Reports','▥'],['Settings','⚙']];
const cap=k=>LIMITS[k],count=k=>(db[k]||[]).length,remaining=k=>Math.max(0,cap(k)-count(k));
function root(){document.getElementById('root').innerHTML='<header class="top"><div class="brand"><div class="mark">R</div><div><span id="storetitle">'+esc(db.store)+'</span><small>Retail management</small></div></div><div class="topright"><span class="badge">DEMO VERSION</span><span class="role">'+esc(db.role)+'</span><button class="btn secondary" onclick="switchRole()">⇄</button></div></header><div class="layout"><aside class="side">'+navs.map(([n,i])=>'<button class="nav '+(page===n?'active':'')+'" onclick="go(\''+n+'\')"><span class="ico">'+i+'</span>'+n+'</button>').join('')+'<div class="sidefoot">Demo data is stored only on this device. No production or Firebase connection.</div></aside><main class="main" id="main"></main></div>';render()}
function go(p){page=p;root()}
function head(title,sub,action=''){return '<div class="pagehead"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div>'+action+'</div>'}
function stat(label,val,note){return '<div class="card"><div class="statlabel">'+label+'</div><div class="statvalue">'+val+'</div><div class="statnote">'+note+'</div></div>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+headers.length+'" class="empty">No records yet</td></tr>')+'</tbody></table></div>'}
function render(){let el=document.getElementById('main');if(!el)return;let html='';
if(page==='Dashboard'){let rev=db.sales.reduce((s,x)=>s+x.total,0),profit=db.sales.reduce((s,x)=>s+x.profit,0),low=db.products.filter(x=>x.stock<=5);html=head('Dashboard','Your store at a glance')+'<div class="grid stats">'+stat('Total sales',money(rev),db.sales.length+' / '+cap('sales')+' demo transactions')+stat('Estimated profit',money(profit),'Based on sale-time product cost')+stat('Products',count('products')+' / '+cap('products'),'Demo catalogue capacity')+stat('Low stock',low.length,'Products with 5 units or less')+'</div><div class="card" style="margin-bottom:16px"><div class="cardhead"><h3>Quick actions</h3></div><div class="quick"><button onclick="go(\'New Sale\')"><span>＋</span>New sale</button><button onclick="openProduct()"><span>▦</span>Add product</button><button onclick="openCustomer()"><span>♙</span>Add customer</button><button onclick="go(\'Reports\')"><span>▥</span>View reports</button></div></div><div class="grid two"><div class="card"><div class="cardhead"><h3>Recent sales</h3><button class="btn ghost" onclick="go(\'Sales\')">View all</button></div>'+table(['Receipt','Date','Amount'],db.sales.slice(-5).reverse().map(s=>'<tr><td>'+esc(s.receipt)+'</td><td>'+esc(s.date)+'</td><td class="amount">'+money(s.total)+'</td></tr>'))+'</div><div class="card"><div class="cardhead"><h3>Demo usage</h3></div>'+Object.entries(LIMITS).map(([k,v])=>'<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><b>'+k[0].toUpperCase()+k.slice(1)+'</b><span>'+count(k)+' / '+v+'</span></div><div class="progress"><i style="width:'+Math.min(100,count(k)/v*100)+'%"></i></div></div>').join('')+'</div></div>'}
else if(page==='Products'){html=head('Products','Inventory catalogue · '+remaining('products')+' slots remaining','<button class="btn" onclick="openProduct()">＋ Add product</button>')+'<div class="card"><div class="toolbar"><input class="search" placeholder="Search name, SKU or category" oninput="filterRows(this.value,\'productsTable\')"></div><div id="productsTable">'+productsTable()+'</div></div>'}
else if(page==='New Sale'){html=head('New sale','Build a cart and complete a demo transaction')+'<div class="grid two"><div class="card"><div class="cardhead"><h3>Available products</h3></div>'+table(['Product','Price','Stock',''],db.products.map(p=>'<tr><td><b>'+esc(p.name)+'</b><br><small class="muted">'+esc(p.sku)+'</small></td><td>'+money(p.price)+'</td><td>'+p.stock+'</td><td><button class="btn secondary" onclick="addCart('+p.id+')">Add</button></td></tr>'))+'</div><div class="card"><div class="cardhead"><h3>Current cart</h3><span class="pill" id="cartcount">0 items</span></div><div id="cartbox" class="empty">Choose products to start a sale.</div></div></div>';window.cart=window.cart||[];setTimeout(drawCart,0)}
else if(page==='Sales'){html=head('Sales history','Completed receipts · '+count('sales')+' / '+cap('sales'))+'<div class="card">'+table(['Receipt','Date','Items','Payment','Total',''],db.sales.slice().reverse().map(s=>'<tr><td>'+esc(s.receipt)+'</td><td>'+esc(s.date)+'</td><td>'+s.items.length+'</td><td>'+esc(s.payment)+'</td><td>'+money(s.total)+'</td><td><button class="btn ghost" onclick="receipt(\''+s.id+'\')">Receipt</button></td></tr>'))+'</div>'}
else if(page==='Customers'){html=head('Customers','Customer directory and balances · '+remaining('customers')+' slots','<button class="btn" onclick="openCustomer()">＋ Add customer</button>')+'<div class="card">'+table(['Customer','Phone','Balance'],db.customers.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.phone)+'</td><td>'+money(c.balance)+'</td></tr>'))+'</div>'}
else if(page==='Suppliers'){html=head('Suppliers','Supplier directory · '+remaining('suppliers')+' slots','<button class="btn" onclick="openSupplier()">＋ Add supplier</button>')+'<div class="card">'+table(['Supplier','Phone'],db.suppliers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td></tr>'))+'</div>'}
else if(page==='Purchases'){html=head('Purchases','Stock-in records · '+remaining('purchases')+' remaining','<button class="btn" onclick="openPurchase()">＋ Record purchase</button>')+'<div class="card">'+table(['Date','Supplier','Product','Qty','Total'],db.purchases.slice().reverse().map(x=>'<tr><td>'+x.date+'</td><td>'+esc(x.supplier)+'</td><td>'+esc(x.product)+'</td><td>'+x.qty+'</td><td>'+money(x.total)+'</td></tr>'))+'</div>'}
else if(page==='Expenses'){html=head('Expenses','Operating costs · '+remaining('expenses')+' remaining','<button class="btn" onclick="openExpense()">＋ Add expense</button>')+'<div class="card">'+table(['Date','Description','Amount'],db.expenses.slice().reverse().map(x=>'<tr><td>'+x.date+'</td><td>'+esc(x.description)+'</td><td>'+money(x.amount)+'</td></tr>'))+'</div>'}
else if(page==='Returns'){html=head('Returns','Refund records · '+remaining('returns')+' remaining','<button class="btn" onclick="openReturn()">＋ Record return</button>')+'<div class="card">'+table(['Date','Receipt','Reason','Refund'],db.returns.slice().reverse().map(x=>'<tr><td>'+x.date+'</td><td>'+esc(x.receipt)+'</td><td>'+esc(x.reason)+'</td><td>'+money(x.amount)+'</td></tr>'))+'</div>'}
else if(page==='Reports'){let rev=db.sales.reduce((s,x)=>s+x.total,0),cost=db.sales.reduce((s,x)=>s+x.cost,0),exp=db.expenses.reduce((s,x)=>s+x.amount,0);html=head('Reports','Demo performance overview','<button class="btn secondary" onclick="window.print()">Print report</button>')+'<div class="card"><div class="printhead"><h2>'+esc(db.store)+'</h2><p>Demo business report</p></div><div class="grid stats">'+stat('Gross sales',money(rev),db.sales.length+' transactions')+stat('Cost of goods',money(cost),'Sale-time cost snapshots')+stat('Gross profit',money(rev-cost), 'Before expenses')+stat('Expenses',money(exp),'Recorded operating costs')+'</div><h3>Sales summary</h3>'+table(['Metric','Value'],[['Completed sales',db.sales.length],['Returns',db.returns.length],['Purchases',db.purchases.length],['Net after expenses',money(rev-cost-exp)]].map(x=>'<tr><td>'+x[0]+'</td><td><b>'+x[1]+'</b></td></tr>'))+'</div>'}
else if(page==='Settings'){html=head('Settings','Store profile, access and demo data')+'<div class="grid two"><div class="card"><h3>Store profile</h3><div class="field"><label>Store name (shown on app and printouts)</label><input id="storename" value="'+esc(db.store)+'" maxlength="50"></div><button class="btn" onclick="saveStore()">Save store name</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Appearance</h3><p class="sub">Light and dark display modes</p><button class="btn secondary" onclick="toggleTheme()">Switch to '+(db.theme==='light'?'dark':'light')+' theme</button></div><div class="card"><h3>Demo access</h3><p class="sub">Owner can manage settings. Cashier can create sales only.</p><p><b>Owner PIN:</b> 2468</p><p><b>Cashier PIN:</b> 1357</p><button class="btn secondary" onclick="switchRole()">Switch role</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Local demo data</h3><p class="sub">Reset sample records on this device. Usage counters are local too and can be bypassed by clearing app storage or reinstalling.</p><button class="btn danger" onclick="resetDemo()">Reset demo data</button></div></div><div class="notice" style="margin-top:16px">Demo limitations are enforced in this app&#39;s local data. This offline APK is not tamper-proof. Do not use real business data.</div>'}
el.innerHTML=html;if(db.theme==='dark')document.body.classList.add('dark');else document.body.classList.remove('dark');
}
function productsTable(){return table(['Product','SKU','Category','Cost','Price','Stock','Status'],db.products.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.sku)+'</td><td>'+esc(p.category)+'</td><td>'+money(p.cost)+'</td><td>'+money(p.price)+'</td><td>'+p.stock+'</td><td><span class="pill '+(p.stock<=5?'low':'')+'">'+(p.stock<=5?'Low stock':'In stock')+'</span></td></tr>'))}
window.filterRows=(v,id)=>{let q=v.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')};
function show(title,body,submit){let m=document.getElementById('modal'),d=document.getElementById('dialog');d.innerHTML='<h2>'+title+'</h2><form id="form">'+body+'<div class="dialogfoot"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save</button></div></form>';m.classList.add('show');document.getElementById('form').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));submit(data);closeModal();save();render()}}
window.closeModal=()=>document.getElementById('modal').classList.remove('show');
const field=(label,name,type='text',extra='')=>'<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" required '+extra+'></div>';
function blocked(k){if(remaining(k)<=0){alert('Demo limit reached for '+k+'. Upgrade to the full version to continue.');return true}return false}
window.openProduct=()=>{if(blocked('products'))return;show('Add product',field('Product name','name')+field('SKU / Barcode','sku')+field('Category','category')+field('Selling price (Rs)','price','number','min="0" step="0.01"')+field('Cost price (Rs)','cost','number','min="0" step="0.01"')+field('Opening stock','stock','number','min="0"'),d=>{db.products.push({id:db.next++,name:d.name,sku:d.sku,category:d.category,price:+d.price,cost:+d.cost,stock:+d.stock});if(!db.categories.includes(d.category)&&remaining('categories')>0)db.categories.push(d.category)})};
window.openCustomer=()=>{if(blocked('customers'))return;show('Add customer',field('Customer name','name')+field('Phone','phone'),d=>db.customers.push({id:db.next++,name:d.name,phone:d.phone,balance:0}))};
window.openSupplier=()=>{if(blocked('suppliers'))return;show('Add supplier',field('Supplier name','name')+field('Phone','phone'),d=>db.suppliers.push({id:db.next++,name:d.name,phone:d.phone}))};
window.openExpense=()=>{if(blocked('expenses'))return;show('Add expense',field('Description','description')+field('Amount (Rs)','amount','number','min="0" step="0.01"'),d=>db.expenses.push({date:new Date().toLocaleDateString(),description:d.description,amount:+d.amount}))};
window.openPurchase=()=>{if(blocked('purchases'))return;if(!db.products.length)return alert('Add a product first');show('Record purchase','<div class="field"><label>Product</label><select name="pid">'+db.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div><div class="field"><label>Supplier</label><select name="supplier">'+db.suppliers.map(s=>'<option>'+esc(s.name)+'</option>').join('')+'</select></div>'+field('Quantity','qty','number','min="1"')+field('Unit cost (Rs)','cost','number','min="0" step="0.01"'),d=>{let p=db.products.find(x=>x.id==d.pid),q=+d.qty;p.stock+=q;p.cost=+d.cost;db.purchases.push({date:new Date().toLocaleDateString(),supplier:d.supplier,product:p.name,qty:q,total:q*+d.cost})})};
window.openReturn=()=>{if(blocked('returns'))return;if(!db.sales.length)return alert('Complete a sale first');show('Record return','<div class="field"><label>Receipt</label><select name="sid">'+db.sales.map(s=>'<option value="'+s.id+'">'+esc(s.receipt)+' · '+money(s.total)+'</option>').join('')+'</select></div>'+field('Reason','reason')+field('Refund amount (Rs)','amount','number','min="0" step="0.01"'),d=>{let s=db.sales.find(x=>x.id===d.sid);db.returns.push({date:new Date().toLocaleDateString(),receipt:s.receipt,reason:d.reason,amount:+d.amount})})};
window.addCart=id=>{let p=db.products.find(x=>x.id===id);if(!p||p.stock<=0)return alert('No stock available');let item=cart.find(x=>x.id===id);if(item){if(item.qty>=p.stock)return alert('Not enough stock');item.qty++}else cart.push({id,qty:1});drawCart()};
function drawCart(){let box=document.getElementById('cartbox');if(!box)return;let total=cart.reduce((s,x)=>s+db.products.find(p=>p.id===x.id).price*x.qty,0);document.getElementById('cartcount').innerText=cart.reduce((s,x)=>s+x.qty,0)+' items';box.innerHTML=cart.length?cart.map(x=>{let p=db.products.find(p=>p.id===x.id);return '<div style="display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>'+esc(p.name)+'</b><div class="sub">'+money(p.price)+' × '+x.qty+'</div></div><button class="btn secondary" onclick="removeCart('+x.id+')">−</button></div>'}).join('')+'<div style="display:flex;justify-content:space-between;padding:15px 0;font-size:18px"><b>Total</b><b>'+money(total)+'</b></div><div class="field"><label>Payment method</label><select id="payment"><option>Cash</option><option>Card</option><option>Credit</option></select></div><div class="field"><label>Customer (optional)</label><select id="customer"><option value="">Walk-in customer</option>'+db.customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><button class="btn" style="width:100%" onclick="completeSale()">Complete sale</button>':'<div class="empty">Choose products to start a sale.</div>'}
window.removeCart=id=>{cart=cart.filter(x=>x.id!==id);drawCart()};
window.completeSale=()=>{if(blocked('sales'))return;let total=0,cost=0,items=[];for(let x of cart){let p=db.products.find(p=>p.id===x.id);if(p.stock<x.qty)return alert('Stock changed. Adjust cart.');total+=p.price*x.qty;cost+=p.cost*x.qty;items.push({name:p.name,qty:x.qty,price:p.price,cost:p.cost});p.stock-=x.qty}let payment=document.getElementById('payment').value,cid=document.getElementById('customer').value;if(payment==='Credit'&&blocked('credits'))return;let sale={id:'S'+Date.now(),receipt:'R-'+String(db.sales.length+1).padStart(4,'0'),date:new Date().toLocaleString(),items,total,cost,profit:total-cost,payment,customer:cid};db.sales.push(sale);if(payment==='Credit'){db.credits.push({sale:sale.id,amount:total});let c=db.customers.find(c=>c.id==cid);if(c)c.balance+=total}cart=[];save();go('Sales');setTimeout(()=>receipt(sale.id),100)};
window.receipt=id=>{let s=db.sales.find(x=>x.id===id);if(!s)return;let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print receipt');w.document.write('<html><head><title>'+esc(s.receipt)+'</title><style>body{font:14px Arial;max-width:360px;margin:20px auto}h2,p{text-align:center}table{width:100%;border-collapse:collapse}td{padding:7px 0;border-bottom:1px dashed #bbb}.r{text-align:right}</style></head><body><h2>'+esc(db.store)+'</h2><p>DEMO RECEIPT<br>'+esc(s.receipt)+'<br>'+esc(s.date)+'</p><table>'+s.items.map(x=>'<tr><td>'+esc(x.name)+' × '+x.qty+'</td><td class="r">'+money(x.price*x.qty)+'</td></tr>').join('')+'<tr><td><b>Total</b></td><td class="r"><b>'+money(s.total)+'</b></td></tr></table><p>Payment: '+esc(s.payment)+'</p><p>Thank you!</p><script>window.onload=()=>window.print()<\\/script></body></html>');w.document.close()};
window.saveStore=()=>{let v=document.getElementById('storename').value.trim();if(!v)return alert('Enter a store name');db.store=v;save();root()};
window.switchRole=()=>{let pin=prompt('Enter demo PIN (Owner 2468 / Cashier 1357):');if(pin==='2468'){db.role='Owner';save();root()}else if(pin==='1357'){db.role='Cashier';save();root()}else if(pin!==null)alert('Incorrect PIN')};
window.toggleTheme=()=>{db.theme=db.theme==='light'?'dark':'light';save();render()};
window.resetDemo=()=>{if(db.role!=='Owner')return alert('Only Owner can reset demo data');if(confirm('Reset all local demo records to sample data?')){db=seed();save();go('Dashboard')}};
const originalRender=render; // keep a role gate on protected actions and navigation
const oldGo=window.go;
window.go=p=>{if(db.role==='Cashier'&&['Products','Customers','Suppliers','Purchases','Expenses','Returns','Reports','Settings'].includes(p))return alert('This section is available to the Owner role in this demo.');go(p)};
function login(){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><div class="mark">R</div><h1>'+esc(db.store)+'</h1><p class="sub">Retail management demo · Offline mode</p><div class="notice">Use the demo PINs to explore the Owner or Cashier experience.</div><div class="field"><label>4-digit PIN</label><input id="loginpin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div><button class="btn" style="width:100%" onclick="enter()">Continue</button><p class="sub" style="margin-top:16px">Owner: 2468 · Cashier: 1357</p></div></div>'}
window.enter=()=>{let p=document.getElementById('loginpin').value;if(p==='2468')db.role='Owner';else if(p==='1357')db.role='Cashier';else return alert('Incorrect PIN');save();root()};
if(!sessionStorage.getItem('rss_demo_session')){login();const enter=window.enter;window.enter=()=>{enter();sessionStorage.setItem('rss_demo_session','1')}}
else root();
})();
</script></body></html>
